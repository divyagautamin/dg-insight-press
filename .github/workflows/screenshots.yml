name: Layout screenshots (temporary)
on:
  push:
    branches: [ci-screenshots]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx playwright@1.49.1 install --with-deps chromium
      - name: Start site
        run: (npm start -- -p 3000 > server.log 2>&1 &) && npx wait-on@8 http://localhost:3000 --timeout 60000
      - name: Screenshots
        env:
          PAGES: "/,/vocab-decode,/research/etymology-as-a-pedagogical-tool"
        run: npm i --no-save playwright@1.49.1 && node tools/shoot.mjs
      - name: Save screenshots to the branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B ci-screenshots-output
          git add -f shots
          git commit -m "Layout screenshots" -q
          git push -f origin ci-screenshots-output
